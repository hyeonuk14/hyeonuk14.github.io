<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Banana 변환기</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        text-align: center;
        padding: 30px;
    }

    h1 {
        color: #333;
    }

    input {
        width: 300px;
        padding: 10px;
        font-size: 16px;
    }

    button {
        padding: 10px 15px;
        margin: 5px;
        font-size: 14px;
        cursor: pointer;
    }

    textarea {
        width: 80%;
        height: 200px;
        margin-top: 20px;
        font-size: 16px;
        font-family: monospace;
    }
</style>
</head>

<body>

<h1>🍌 Banana 변환기</h1>

<input id="input" placeholder="한글 입력">
<button onclick="convert()">변환</button>
<button onclick="copyText()">복사</button>

<br>

<textarea id="output" readonly></textarea>

<script>
function convert() {
    let input = document.getElementById("input").value;
    let result = "";

    for (let i = 0; i < input.length; i++) {
        let ch = input.charCodeAt(i);

        if (ch >= 0xAC00 && ch <= 0xD7A3) {
            let base = ch - 0xAC00;

            let cho = Math.floor(base / (21 * 28));
            let jung = Math.floor((base % (21 * 28)) / 28);
            let jong = base % 28;

            result += toBana(cho) + " ";
            result += toBana(jung) + " ";
            result += toBana(jong) + " | ";
        } else {
            result += " ";
        }
    }

    document.getElementById("output").value = result;
}

// 0 = 바 / 1 = 나
function toBana(num) {
    let bin = num.toString(2).padStart(5, "0");
    let res = "";

    for (let c of bin) {
        res += (c === "0") ? "바" : "나";
    }

    return res;
}

// 복사 기능
function copyText() {
    let text = document.getElementById("output");
    text.select();
    document.execCommand("copy");
    alert("복사 완료!");
}
</script>

</body>
</html>
